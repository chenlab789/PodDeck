<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PodDeck promo v2</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * PodDeck promo v2: full feature tour. Every frame is render(t) (deterministic).
 * ?w=1080&h=1920 | ?w=1920&h=1080, ?part=intro|outro, ?t=seconds to preview one frame.
 */
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1920);
const PART = q.get('part') || 'intro';
const PORTRAIT = H > W;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');

const C = {
  bg: '#0b0b0c', fg: '#f5f5f7', muted: '#8e8e93', line: '#2c2c2e', border: '#222222', card: '#111113',
  green: '#30d158', red: '#ff6961', orange: '#ff9f0a',
  lbg: '#ffffff', lfg: '#1d1d1f', lmuted: '#6e6e73', lline: '#e5e5ea',
};
const FONT = '"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eback = (x) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function text(s, x, y, size, color, weight = 400, align = 'left', alpha = 1) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha;
  g.font = `${weight} ${size}px ${FONT}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'alphabetic';
  g.fillText(s, x, y); g.restore();
}
function tw(s, size, weight = 400) { g.font = `${weight} ${size}px ${FONT}`; return g.measureText(s).width; }

function pods(x, y, size, color, shadow = false, only = 'both', lift = 0) {
  const k = size / 44;
  g.save(); g.translate(x, y); g.scale(k, k);
  if (shadow) { g.shadowColor = 'rgba(0,0,0,0.35)'; g.shadowBlur = 6; g.shadowOffsetY = 2; }
  g.fillStyle = color;
  [[14, 14, 'L'], [30, 25, 'R']].forEach(([cx, sx, side]) => {
    if (only !== 'both' && only !== side) return;
    const dy = side === 'R' ? -lift : 0;
    g.save(); if (side === 'R') g.globalAlpha *= 1 - 0.65 * clamp(lift / 30);
    g.beginPath(); g.arc(cx, 13 + dy, 7, 0, Math.PI * 2); g.fill();
    rr(sx, 13 + dy, 5, 22, 2.5); g.fill(); g.restore();
  });
  g.restore();
}
function glow(x, y, r, a) {
  if (a <= 0) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(255,255,255,${0.22 * a})`); gr.addColorStop(0.45, `rgba(255,255,255,${0.07 * a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
}

const HX = PORTRAIT ? 96 : 150, HY = PORTRAIT ? 300 : 400;
function headline(lines, sub, p, out = 0, light = false) {
  const a = eo(p) * (1 - out);
  const big = PORTRAIT ? 92 : 84, sm = PORTRAIT ? 38 : 34;
  const dy = (1 - eo(p)) * 36;
  lines.forEach((l, i) => text(l, HX, HY + dy + i * big * 1.08, big, light ? C.lfg : C.fg, 700, 'left', a));
  if (sub) text(sub, HX, HY + dy + lines.length * big * 1.08 + 16, sm, light ? C.lmuted : C.muted, 400, 'left', a);
}
const UI = PORTRAIT ? { x: W / 2, y: 1180 } : { x: 1330, y: 580 };
const K = PORTRAIT ? 1.28 : 1.05;
const KH = PORTRAIT ? 1.9 : 1.4;

function segs(x, y, level, lit, off, n = 10, w = 10, h = 7, gap = 4) {
  const on = Math.ceil(level / 10 - 1e-6);
  for (let i = 0; i < n; i++) { g.fillStyle = i < on ? lit : off; rr(x + i * (w + gap), y, w, h, 2); g.fill(); }
}
function bolt(x, y, s, color) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = color;
  g.beginPath(); g.moveTo(6, 0); g.lineTo(0, 7); g.lineTo(4, 7); g.lineTo(3, 12); g.lineTo(9, 5); g.lineTo(5, 5); g.closePath(); g.fill(); g.restore();
}

// Ink lid card (centered at cx,cy). opts: hideGlyph, light, staleCase
function inkCard(cx, cy, vals, alpha, opts = {}) {
  const w = 760, h = 230, x = -w / 2, y = -h / 2;
  const light = !!opts.light;
  g.save(); g.translate(cx, cy); g.scale(K, K); g.globalAlpha = alpha;
  g.shadowColor = light ? 'rgba(0,0,0,0.18)' : 'rgba(0,0,0,0.6)'; g.shadowBlur = 60; g.shadowOffsetY = 20;
  g.fillStyle = light ? C.lbg : C.bg; rr(x, y, w, h, 38); g.fill(); g.shadowColor = 'transparent';
  g.strokeStyle = light ? C.lline : C.border; g.lineWidth = 2; rr(x, y, w, h, 38); g.stroke();
  if (!opts.hideGlyph) pods(x + 44, y + 62, 92, light ? '#fff' : C.fg, light);
  const fg = light ? C.lfg : C.fg, mu = light ? C.lmuted : C.muted;
  text('AirPods 4', x + 180, y + 66, 26, fg, 600);
  const nx = x + 180 + tw('AirPods 4', 26, 600);
  g.fillStyle = C.green; g.beginPath(); g.arc(nx + 16, y + 58, 5, 0, Math.PI * 2); g.fill();
  text('Connected', nx + 32, y + 66, 22, mu);
  ['LEFT', 'RIGHT', 'CASE'].forEach((lb, i) => {
    const bx = x + 180 + i * 180, v = vals[i];
    const stale = i === 2 && opts.staleCase;
    text(String(Math.round(v)), bx, y + 150, 64, stale ? mu : fg, 300);
    segs(bx, y + 166, v, stale ? mu : fg, light ? '#e5e5ea' : C.line);
    text(lb + (stale ? ' · 2h ago' : ''), bx, y + 205, 18, mu, 500);
  });
  g.restore();
  // where the glyph sits on screen (for the fly-in)
  return { gx: cx + (x + 44 + 46) * K, gy: cy + (y + 62 + 46) * K, gs: 92 * K };
}

function hud(x, y, o, alpha, vals = [70, 60, 85]) {
  g.save(); g.translate(x, y); g.scale(KH, KH); g.globalAlpha = alpha;
  if (o < 0.5) {
    g.fillStyle = C.bg; g.strokeStyle = C.border; g.lineWidth = 2; rr(0, 0, 98, 300, 22); g.fill(); g.stroke();
    pods(22, 22, 36, C.fg);
    g.fillStyle = C.green; g.beginPath(); g.arc(39, 80, 5, 0, Math.PI * 2); g.fill();
    ['L', 'R', 'C'].forEach((l, i) => {
      const yy = 104 + i * 64;
      text(l, 39, yy, 14, C.muted, 500, 'center');
      g.fillStyle = C.line; rr(34, yy + 8, 10, 30, 5); g.fill();
      g.fillStyle = i === 2 ? C.muted : C.fg; const fh = 30 * vals[i] / 100; rr(34, yy + 38 - fh, 10, fh, 5); g.fill();
      text(String(vals[i]), 39, yy + 56, 15, i === 2 ? C.muted : C.fg, 600, 'center');
    });
  } else {
    const w = 470;
    g.fillStyle = C.bg; g.strokeStyle = C.border; g.lineWidth = 2; rr(-w / 2, -20, w, 82, 22); g.fill(); g.stroke();
    pods(-w / 2 + 24, 12, 30, C.fg);
    g.fillStyle = C.green; g.beginPath(); g.arc(-w / 2 + 74, 27, 5, 0, Math.PI * 2); g.fill();
    ['L', 'R', 'C'].forEach((l, i) => {
      const xx = -w / 2 + 98 + i * 124;
      text(l, xx, 33, 15, C.muted, 500);
      g.fillStyle = C.line; rr(xx + 18, 22, 56, 10, 5); g.fill();
      g.fillStyle = i === 2 ? C.muted : C.fg; rr(xx + 18, 22, 56 * vals[i] / 100, 10, 5); g.fill();
      text(String(vals[i]), xx + 82, 34, 16, i === 2 ? C.muted : C.fg, 600);
    });
  }
  g.restore();
}

function desktop(alpha) {
  g.save(); g.globalAlpha = alpha;
  const gr = g.createRadialGradient(W * 0.3, H * 0.2, 0, W * 0.3, H * 0.2, Math.max(W, H));
  gr.addColorStop(0, '#4a5568'); gr.addColorStop(1, '#202329');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(14,14,16,0.92)'; g.fillRect(0, H - 70, W, 70);
  g.restore();
}
function cursor(x, y, pressed) {
  g.save(); g.translate(x, y); const s = (pressed ? 0.9 : 1) * 1.7; g.scale(s, s);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 22); g.lineTo(6, 17); g.lineTo(10, 26); g.lineTo(14, 24); g.lineTo(10, 15); g.lineTo(17, 15); g.closePath();
  g.shadowColor = 'rgba(0,0,0,0.4)'; g.shadowBlur = 6; g.fillStyle = '#fff'; g.fill();
  g.shadowColor = 'transparent'; g.lineWidth = 1.3; g.strokeStyle = '#000'; g.stroke(); g.restore();
}
function toggle(x, y, on, light) {
  g.fillStyle = on > 0.5 ? C.green : (light ? '#e5e5ea' : C.line); rr(x, y, 64, 36, 18); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x + 18 + 28 * eio(on), y + 18, 14, 0, Math.PI * 2); g.fill();
}

const ROWS = ['Pause on Remove', 'Status HUD', 'Keep Stereo', 'Theme', 'Volume'];
// Tray panel centered at cx,cy. st: {toggles:[a,b,c], light, theme, vol, hi (row index highlight 0..1 strength), hiRow}
function panel(cx, cy, st, alpha, scale = 1) {
  const w = 560, h = 640;
  const light = !!st.light;
  g.save(); g.globalAlpha = alpha; g.translate(cx, cy); g.scale(scale * K, scale * K); g.translate(-w / 2, -h / 2);
  const bg = light ? C.lbg : C.bg, fg = light ? C.lfg : C.fg, mu = light ? C.lmuted : C.muted, ln = light ? C.lline : C.line;
  g.shadowColor = light ? 'rgba(0,0,0,0.18)' : 'rgba(0,0,0,0.6)'; g.shadowBlur = 50; g.shadowOffsetY = 16;
  g.fillStyle = bg; rr(0, 0, w, h, 34); g.fill(); g.shadowColor = 'transparent';
  g.strokeStyle = light ? C.lline : C.border; g.lineWidth = 2; rr(0, 0, w, h, 34); g.stroke();
  pods(34, 30, 42, light ? '#fff' : C.fg, light);
  text('AirPods 4', 92, 62, 26, fg, 600);
  text('Connected', w - 34, 62, 21, light ? '#248a3d' : C.green, 500, 'right');
  const vals = [70, 60, 85];
  ['Left', 'Right', 'Case · 2h ago'].forEach((l, i) => {
    const xx = 34 + i * 170;
    text(l, xx, 128, 18, mu); text(vals[i] + '%', xx, 166, 30, i === 2 ? mu : fg, 300);
    segs(xx, 182, vals[i], i === 2 ? mu : fg, light ? '#e5e5ea' : C.line, 10, 8, 6, 3);
  });
  ROWS.forEach((r, i) => {
    const yy = 222 + i * 80;
    if (st.hiRow === i && st.hi > 0) { g.fillStyle = light ? `rgba(0,0,0,${0.05 * st.hi})` : `rgba(255,255,255,${0.07 * st.hi})`; rr(18, yy + 4, w - 36, 74, 14); g.fill(); }
    g.fillStyle = ln; g.fillRect(34, yy, w - 68, 2);
    text(r, 34, yy + 50, 24, fg);
    if (i < 3) toggle(w - 34 - 64, yy + 22, (st.toggles || [1, 1, 0])[i], light);
    else if (i === 3) text(st.theme || (light ? 'Light' : 'Dark'), w - 34, yy + 50, 22, mu, 400, 'right');
    else {
      const v = st.vol ?? 57;
      text(String(Math.round(v)), w - 34, yy + 50, 22, mu, 400, 'right');
    }
  });
  const v = st.vol ?? 57;
  g.fillStyle = ln; rr(34, 222 + 5 * 80 - 6, w - 68, 6, 3); g.fill();
  g.fillStyle = fg; rr(34, 222 + 5 * 80 - 6, (w - 68) * v / 100, 6, 3); g.fill();
  g.restore();
}

function keycap(x, y, label, w, press) {
  const d = 10 * press;
  g.fillStyle = '#18181a'; rr(x, y + 10, w, 96, 18); g.fill();
  g.fillStyle = press > 0.5 ? '#2c2c2e' : '#222225'; rr(x, y + d, w, 96, 18); g.fill();
  g.strokeStyle = '#3a3a3c'; g.lineWidth = 2; rr(x, y + d, w, 96, 18); g.stroke();
  text(label, x + w / 2, y + d + 62, 36, C.fg, 600, 'center');
}
function laptop(x, y, s, color) {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = color; g.lineWidth = 5; g.lineJoin = 'round';
  rr(-60, -44, 120, 78, 8); g.stroke(); g.beginPath(); g.moveTo(-80, 44); g.lineTo(80, 44); g.stroke(); g.restore();
}
function phone(x, y, s, color) {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = color; g.lineWidth = 5;
  rr(-30, -58, 60, 116, 14); g.stroke(); g.beginPath(); g.moveTo(-8, -46); g.lineTo(8, -46); g.stroke(); g.restore();
}
function mic(x, y, s, color) {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = color; g.lineWidth = 5; g.lineCap = 'round';
  rr(-16, -48, 32, 60, 16); g.stroke();
  g.beginPath(); g.arc(0, -4, 28, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  g.beginPath(); g.moveTo(0, 24); g.lineTo(0, 40); g.moveTo(-14, 40); g.lineTo(14, 40); g.stroke(); g.restore();
}
// Audio bars; amp 0..1, rich 0..1 (0 = flat/muffled), t = time for motion
function bars(cx, cy, n, amp, rich, t, color, wBar = 10, gap = 8, maxH = 150) {
  const total = n * wBar + (n - 1) * gap;
  for (let i = 0; i < n; i++) {
    const ph = i * 0.7 + t * 6;
    const full = (0.35 + 0.65 * Math.abs(Math.sin(ph) * Math.sin(ph * 0.37 + i))) * maxH;
    const flat = maxH * (0.12 + 0.05 * Math.abs(Math.sin(ph * 0.5)));
    const h = Math.max(6, lerp(flat, full, rich) * amp);
    g.fillStyle = color; rr(cx - total / 2 + i * (wBar + gap), cy - h / 2, wBar, h, wBar / 2); g.fill();
  }
}

// ---------- timeline ----------
const INTRO = [
  ['hook', 3.0], ['lid', 4.0], ['battery', 3.5], ['memory', 3.0], ['hud', 4.5], ['panel', 3.0],
  ['volume', 3.5], ['pause', 4.5], ['hotkey', 3.5], ['stereo', 3.5], ['theme', 3.0],
];
const OUTRO = [['outro', 3.5]];
const SCENES = PART === 'outro' ? OUTRO : INTRO;
const TOTAL = SCENES.reduce((a, s) => a + s[1], 0);
const START = {}; { let s = 0; for (const [n, d] of SCENES) { START[n] = s; s += d; } }

// Audio cues (seconds, within this part)
const SFX = [];
const cue = (scene, t, kind) => SFX.push({ t: +(START[scene] + t).toFixed(3), kind });
if (PART === 'outro') { SFX.push({ t: 0.35, kind: 'chime' }); }
else {
  [1.25, 1.6, 1.95].forEach((t) => cue('hook', t, 'tick'));
  cue('lid', 0.25, 'chime'); cue('lid', 1.55, 'swell');
  [0.9, 1.1, 1.3].forEach((t) => cue('battery', t, 'tick')); cue('battery', 2.1, 'tick');
  cue('memory', 1.0, 'tick');
  cue('hud', 0.25, 'swell'); cue('hud', 1.6, 'whoosh'); cue('hud', 2.45, 'toggle');
  cue('panel', 0.05, 'swell'); [0.9, 1.4, 1.9].forEach((t) => cue('panel', t, 'tick'));
  for (let t = 0.75; t < 2.9; t += 0.16) cue('volume', t, 'fine');
  cue('pause', 1.0, 'toggle'); cue('pause', 1.0, 'duck_out'); cue('pause', 3.0, 'duck_in'); cue('pause', 3.0, 'toggle');
  [0.3, 0.45, 0.6].forEach((t) => cue('hotkey', t, 'key')); cue('hotkey', 2.0, 'arrive');
  cue('stereo', 0.0, 'muffle_on'); cue('stereo', 1.6, 'toggle'); cue('stereo', 1.6, 'muffle_off');
  cue('theme', 0.55, 'whoosh'); cue('theme', 1.6, 'whoosh');
}
window.SFX = SFX; window.TOTAL = TOTAL;

const fadeIO = (lt, d, a = 0.22, b = 0.28) => Math.min(clamp(lt / a), clamp((d - lt) / b));

// ---------- scenes ----------
const S = {};

S.hook = (lt, d) => {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const out = clamp((lt - (d - 0.35)) / 0.35);
  headline(['AirPods', 'on Windows?'], null, prog(lt, 0.05, 0.7), out);
  const items = ['Battery', 'Auto-pause', 'One-tap switch'];
  const y0 = PORTRAIT ? 640 : 690;
  items.forEach((s, i) => {
    const ap = eo(prog(lt, 0.7 + i * 0.35, 1.05 + i * 0.35)) * (1 - out);
    const yy = y0 + i * 92;
    text(s, HX, yy, 54, C.muted, 500, 'left', ap);
    const sp = eio(prog(lt, 1.1 + i * 0.35, 1.4 + i * 0.35));
    if (sp > 0) { g.save(); g.globalAlpha = 1 - out; g.strokeStyle = C.red; g.lineWidth = 6; g.lineCap = 'round';
      g.beginPath(); g.moveTo(HX - 6, yy - 18); g.lineTo(HX - 6 + (tw(s, 54, 500) + 12) * sp, yy - 18); g.stroke(); g.restore(); }
  });
};

S.lid = (lt, d) => {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const f = fadeIO(lt, d);
  headline(['Open the case.', 'See everything.'], null, prog(lt, 0.1, 0.7), 1 - f);
  const cardY = PORTRAIT ? UI.y + 260 : UI.y + 180;
  const startX = UI.x, startY = PORTRAIT ? UI.y - 170 : UI.y - 200;
  const rise = eo(prog(lt, 0.2, 1.2));
  const cardP = eo(prog(lt, 1.35, 2.0));
  const fly = eio(prog(lt, 1.6, 2.3));
  // card first (glyph flies onto it)
  let slot = null;
  if (cardP > 0) {
    const c = eo(prog(lt, 1.9, 2.9));
    slot = inkCard(UI.x, lerp(cardY + 260, cardY, cardP), [70 * c, 60 * c, 85 * c], f * cardP, { hideGlyph: true });
  }
  const bigS = PORTRAIT ? 260 : 220;
  let gx = startX, gy = lerp(startY + 160, startY, rise), gs = bigS * (0.85 + 0.15 * rise);
  if (slot && fly > 0) { gx = lerp(gx, slot.gx, fly); gy = lerp(gy, slot.gy, fly); gs = lerp(gs, slot.gs, fly); }
  const pulse = 0.85 + 0.15 * Math.sin(lt * 3);
  glow(gx, gy, gs * 1.6, f * rise * (1 - fly * 0.85) * pulse);
  pods(gx - gs / 2, gy - gs / 2, gs, C.fg, false);
  // thin light streak under the rising pods
  if (rise > 0 && fly < 1) {
    const gr = g.createLinearGradient(gx, gy + gs / 2, gx, gy + gs / 2 + 220);
    gr.addColorStop(0, `rgba(245,245,247,${0.35 * (1 - fly) * f})`); gr.addColorStop(1, 'rgba(245,245,247,0)');
    g.fillStyle = gr; g.fillRect(gx - 1.5, gy + gs / 2 + 10, 3, 220 * rise);
  }
};

S.battery = (lt, d) => {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const f = fadeIO(lt, d);
  headline(['Every pod.', 'Every percent.'], null, prog(lt, 0.05, 0.6), 1 - f);
  const cols = PORTRAIT ? [[HX, 900], [HX, 1210], [HX, 1520]] : [[900, 640], [1230, 640], [1560, 640]];
  const right = lerp(40, 15, eio(prog(lt, 0.9, 2.0)));
  const caseC = lerp(60, 85, eio(prog(lt, 1.4, 2.6)));
  const items = [
    ['LEFT', 70, C.fg, ''],
    ['RIGHT', right, right <= 20 ? C.orange : C.fg, right <= 20 ? ' · low' : ''],
    ['CASE', caseC, C.fg, ' · charging'],
  ];
  items.forEach(([lb, v, col, extra], i) => {
    const a = eo(prog(lt, 0.25 + i * 0.15, 0.7 + i * 0.15)) * f;
    const [x, y] = cols[i];
    const sz = PORTRAIT ? 200 : 170;
    text(String(Math.round(v)), x, y, sz, col, 200, 'left', a);
    const nw = tw(String(Math.round(v)), sz, 200);
    if (i === 2) { g.save(); g.globalAlpha = a * (0.6 + 0.4 * Math.sin(lt * 6)); bolt(x + nw + 14, y - sz * 0.62, 4, C.green); g.restore(); }
    g.save(); g.globalAlpha = a; segs(x + 4, y + 26, v, col, C.line, 10, 18, 10, 6); g.restore();
    text(lb + extra, x + 4, y + 82, 30, i === 1 && right <= 20 ? C.orange : C.muted, 500, 'left', a);
  });
};

S.memory = (lt, d) => {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const f = fadeIO(lt, d);
  headline(['Pods in your ears?', 'Case battery stays.'], null, prog(lt, 0.05, 0.6), 1 - f);
  const x = PORTRAIT ? HX : 900, y = PORTRAIT ? 1150 : 700;
  const dim = eio(prog(lt, 0.8, 1.5));
  const col = `rgb(${Math.round(lerp(245, 142, dim))},${Math.round(lerp(245, 142, dim))},${Math.round(lerp(247, 147, dim))})`;
  const sz = PORTRAIT ? 260 : 220;
  text('85', x, y, sz, col, 200, 'left', f);
  g.save(); g.globalAlpha = f; segs(x + 6, y + 30, 85, col, C.line, 10, 22, 12, 7); g.restore();
  const label = 'CASE · 2h ago';
  const n = Math.round(lerp(4, label.length, prog(lt, 1.0, 1.7)));
  text(label.slice(0, n), x + 6, y + 100, 36, C.muted, 500, 'left', f);
  // pods drifting up toward "ears"
  const up = eo(prog(lt, 0.2, 1.2));
  pods((PORTRAIT ? W - 300 : 1600), lerp(PORTRAIT ? 1100 : 640, PORTRAIT ? 820 : 360, up), 140, C.fg);
};

S.hud = (lt, d) => {
  const f = fadeIO(lt, d);
  desktop(f);
  g.save(); g.globalAlpha = f; headline(['Battery HUD.', 'Any edge.'], null, prog(lt, 0.05, 0.6), 0); g.restore();
  const slide = eo(prog(lt, 0.25, 0.75));
  const restX = W - 78 * KH, restY = PORTRAIT ? 720 : 330;
  const grab = lt > 1.5, drag = eio(prog(lt, 1.6, 2.4)), snap = eo(prog(lt, 2.4, 2.7));
  let hx = lerp(W + 40, restX, slide), hy = restY;
  const topX = W / 2;
  if (drag > 0) { hx = lerp(restX, topX - 40 * KH, drag); hy = lerp(restY, 60, drag); }
  if (snap > 0) { hud(topX, 20 * KH, 1, f * snap); hud(hx, hy, 0, f * (1 - snap)); } else hud(hx, hy, 0, f);
  const gdx = 40 * KH, gdy = 150 * KH;
  const cin = eo(prog(lt, 0.9, 1.5));
  let cx = lerp(W * 0.55, restX + gdx, cin), cy = lerp(H * 0.85, restY + gdy, cin);
  if (drag > 0) { cx = hx + gdx; cy = hy + gdy; }
  if (snap > 0) { cx = lerp(cx, topX + 60 * KH, snap); cy = lerp(cy, 70 * KH, snap); }
  if (lt > 0.9) cursor(cx, cy, grab && snap === 0);
};

S.panel = (lt, d) => {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const f = fadeIO(lt, d);
  headline(['Everything', 'one click away.'], null, prog(lt, 0.05, 0.5), 1 - f);
  const pop = eback(prog(lt, 0, 0.4));
  // highlight sweeps down the rows
  const row = Math.floor(prog(lt, 0.8, 2.6) * 5 - 1e-6);
  const hi = 1;
  panel(UI.x, PORTRAIT ? UI.y + 120 : UI.y + 20, { toggles: [1, 1, 0], hiRow: row, hi, vol: 57 }, f * clamp(pop * 1.4), 0.9 + 0.1 * pop);
};

S.volume = (lt, d) => {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const f = fadeIO(lt, d);
  headline(['Volume,', 'right there.'], null, prog(lt, 0.05, 0.5), 1 - f);
  // volume path: 40 -> 90 -> 25 -> 60
  const p1 = eio(prog(lt, 0.7, 1.5)), p2 = eio(prog(lt, 1.6, 2.3)), p3 = eio(prog(lt, 2.4, 2.9));
  let v = 40; v = lerp(v, 90, p1); v = lerp(v, 25, p2); v = lerp(v, 60, p3);
  const bx = PORTRAIT ? 120 : 760, bw = PORTRAIT ? W - 240 : 1040, by = PORTRAIT ? 1250 : 760;
  g.save(); g.globalAlpha = f;
  text('Volume', bx, by - 60, 40, C.fg, 500);
  text(String(Math.round(v)), bx + bw, by - 40, 120, C.fg, 200, 'right');
  g.fillStyle = C.line; rr(bx, by, bw, 12, 6); g.fill();
  g.fillStyle = C.fg; rr(bx, by, bw * v / 100, 12, 6); g.fill();
  g.beginPath(); g.arc(bx + bw * v / 100, by + 6, 18, 0, Math.PI * 2); g.fill();
  bars(bx + bw / 2, PORTRAIT ? 980 : 520, PORTRAIT ? 26 : 40, 0.25 + 0.75 * v / 100, 1, lt, C.fg, 12, 10, PORTRAIT ? 260 : 200);
  g.restore();
  if (lt > 0.5) cursor(bx + bw * v / 100 - 4, by + 4, lt > 0.7 && lt < 2.95);
};

S.pause = (lt, d) => {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const f = fadeIO(lt, d);
  headline(['Take one out.', 'Music pauses.'], null, prog(lt, 0.05, 0.5), 1 - f);
  const out = eio(prog(lt, 0.7, 1.0)), back = eio(prog(lt, 2.7, 3.0));
  const lift = 14 * (out - back);   // in glyph units (44-unit grid)
  const playing = lt < 1.0 || lt > 3.0;
  const cx = UI.x, cy = PORTRAIT ? 1000 : 520;
  g.save(); g.globalAlpha = f;
  pods(cx - 120, cy - 260, 240, C.fg, false, 'both', lift);
  // music bars freeze/flatten while paused
  const amp = playing ? 1 : lerp(1, 0.08, eo(prog(lt, 1.0, 1.3)));
  bars(cx, PORTRAIT ? 1300 : 760, PORTRAIT ? 24 : 34, amp, 1, playing ? lt : 1.0, C.fg, 12, 10, 160);
  // pause / play badge
  const pa = (lt > 1.0 && lt < 3.0) ? eo(prog(lt, 1.0, 1.25)) : 0;
  const pl = lt > 3.0 ? eo(prog(lt, 3.0, 3.25)) * (1 - prog(lt, 3.9, 4.3)) : 0;
  const bxx = cx, byy = PORTRAIT ? 1520 : 900;
  if (pa > 0) { g.save(); g.globalAlpha = f * pa; g.strokeStyle = C.fg; g.lineWidth = 4; g.beginPath(); g.arc(bxx, byy, 54, 0, Math.PI * 2); g.stroke();
    g.fillStyle = C.fg; rr(bxx - 18, byy - 22, 12, 44, 4); g.fill(); rr(bxx + 6, byy - 22, 12, 44, 4); g.fill(); g.restore(); }
  if (pl > 0) { g.save(); g.globalAlpha = f * pl; g.strokeStyle = C.fg; g.lineWidth = 4; g.beginPath(); g.arc(bxx, byy, 54, 0, Math.PI * 2); g.stroke();
    g.fillStyle = C.fg; g.beginPath(); g.moveTo(bxx - 14, byy - 24); g.lineTo(bxx + 24, byy); g.lineTo(bxx - 14, byy + 24); g.closePath(); g.fill(); g.restore(); }
  text(lt > 3.0 ? 'Put it back. It plays.' : '', cx, byy + 120, 38, C.muted, 500, 'center', eo(prog(lt, 3.1, 3.4)));
  g.restore();
};

S.hotkey = (lt, d) => {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const f = fadeIO(lt, d);
  g.save(); g.globalAlpha = f;
  const keys = [['Ctrl', 150], ['Alt', 130], ['A', 110]];
  const total = keys.reduce((a, k) => a + k[1], 0) + 48;
  const kcx = PORTRAIT ? W / 2 : 560, kcy = PORTRAIT ? 640 : 400;
  g.save(); g.translate(kcx, kcy); g.scale(K * 1.15, K * 1.15); g.translate(-kcx, -kcy);
  let kx = kcx - total / 2;
  keys.forEach(([l, w], i) => { keycap(kx, kcy - 50, l, w, prog(lt, 0.25 + i * 0.15, 0.33 + i * 0.15) * (1 - prog(lt, 1.1, 1.25))); kx += w + 24; });
  g.restore();
  const ix = PORTRAIT ? W / 2 : 1330, iy = PORTRAIT ? 1200 : 560;
  laptop(ix - 200, iy, 1.4, C.fg); phone(ix + 200, iy, 1.4, C.fg);
  const hop = eio(prog(lt, 1.0, 2.0));
  const back = eio(prog(lt, 2.4, 3.2));
  const t2 = hop - back;
  const dx = lerp(ix - 200, ix + 200, t2), dy = iy - 160 * Math.sin(Math.PI * t2);
  glow(dx, dy, 120, 0.7);
  pods(dx - 34, dy - 34, 68, C.fg);
  g.strokeStyle = C.line; g.lineWidth = 3; g.setLineDash([8, 10]);
  g.beginPath(); g.moveTo(ix - 130, iy - 40); g.quadraticCurveTo(ix, iy - 290, ix + 130, iy - 40); g.stroke(); g.setLineDash([]);
  text('PC ⇄ iPhone', ix, iy + 180, 56, C.fg, 700, 'center');
  text('one hotkey', ix, iy + 236, 32, C.muted, 400, 'center');
  g.restore();
};

S.stereo = (lt, d) => {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const f = fadeIO(lt, d);
  headline(['Keep Stereo.', 'Calls stay crisp.'], null, prog(lt, 0.05, 0.5), 1 - f);
  const on = eio(prog(lt, 1.5, 1.8));
  const cx = UI.x, cy = PORTRAIT ? 1050 : 560;
  g.save(); g.globalAlpha = f;
  bars(cx, cy, PORTRAIT ? 24 : 36, 1, on, lt, on > 0.5 ? C.fg : '#636366', 12, 10, 220);
  text(on > 0.5 ? 'Full stereo' : 'Muffled hands-free audio', cx, cy + 190, 36, on > 0.5 ? C.green : C.orange, 500, 'center');
  // mic moves from the AirPods to the PC mic
  const mx = lerp(cx - 220, cx + 220, on);
  pods(cx - 270, cy + 260, 100, C.fg); laptop(cx + 220, cy + 320, 0.9, C.fg);
  mic(mx, cy + 300 - 120, 0.9, C.fg);
  toggle(cx - 32, PORTRAIT ? 1560 : 920, on, false);
  text('Keep Stereo', cx, (PORTRAIT ? 1560 : 920) + 80, 30, C.muted, 500, 'center');
  g.restore();
};

S.theme = (lt, d) => {
  const f = fadeIO(lt, d, 0.15, 0.3);
  const w1 = eio(prog(lt, 0.5, 1.0)), w2 = eio(prog(lt, 1.55, 2.05));
  const pcx = UI.x, pcy = PORTRAIT ? UI.y + 120 : UI.y + 20;
  // dark
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  headline(['Dark. Light.', 'Or follow Windows.'], null, prog(lt, 0, 0.4), 1 - f);
  panel(pcx, pcy, { toggles: [1, 1, 0], theme: 'Dark' }, f, 1);
  // light
  if (w1 > 0) {
    g.save(); g.beginPath(); g.rect(0, 0, W * w1, H); g.clip();
    g.fillStyle = '#f2f2f5'; g.fillRect(0, 0, W, H);
    headline(['Dark. Light.', 'Or follow Windows.'], null, 1, 1 - f, true);
    panel(pcx, pcy, { toggles: [1, 1, 0], light: true, theme: w2 > 0.5 ? 'Auto' : 'Light' }, f, 1);
    g.restore();
  }
  // auto: diagonal split
  if (w2 > 0) {
    g.save(); g.beginPath(); g.moveTo(W, 0); g.lineTo(W, H); g.lineTo(W - W * 1.4 * w2, H); g.lineTo(W - W * 0.6 * w2, 0); g.closePath(); g.clip();
    g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
    headline(['Dark. Light.', 'Or follow Windows.'], null, 1, 1 - f);
    panel(pcx, pcy, { toggles: [1, 1, 0], theme: 'Auto' }, f, 1);
    g.restore();
  }
};

S.outro = (lt, d) => {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const f = Math.min(clamp(lt / 0.3), clamp((d - lt) / 0.45));
  g.save(); g.globalAlpha = f;
  const cx = W / 2, cy = H / 2 - (PORTRAIT ? 120 : 60);
  const s = eback(prog(lt, 0.15, 0.7));
  glow(cx, cy - 120, 260, s * 0.9);
  g.save(); g.translate(cx, cy - 120); g.scale(s, s); pods(-65, -65, 130, C.fg); g.restore();
  const tp = eo(prog(lt, 0.45, 0.95));
  text('PodDeck', cx, cy + 80 + (1 - tp) * 20, 116, C.fg, 700, 'center', tp);
  text('Free · open source · Windows', cx, cy + 145, 36, C.muted, 400, 'center', eo(prog(lt, 0.75, 1.15)));
  const lp = eo(prog(lt, 1.35, 1.8));
  text('link in bio', cx, cy + (PORTRAIT ? 340 : 255), 48, C.fg, 600, 'center', lp);
  text('@chenlab789', cx, cy + (PORTRAIT ? 395 : 305), 32, C.muted, 400, 'center', lp);
  g.restore();
};

function render(t) {
  let s = 0;
  for (let i = 0; i < SCENES.length; i++) {
    const [name, d] = SCENES[i];
    if (t < s + d || i === SCENES.length - 1) { S[name](clamp(t - s, 0, d), d); return; }
    s += d;
  }
}
window.render = render;
if (q.has('t')) render(+q.get('t'));
else if (!q.has('static')) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); }; loop(); }
</script>
